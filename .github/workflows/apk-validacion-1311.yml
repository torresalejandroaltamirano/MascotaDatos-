name: MascotaDatos 1.3.11 - APK de validacion
on:
  pull_request:
    branches: [v1.3.11-cierre]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Aplicar correcciones finales sin alterar icono
        run: python3 scripts/aplicar_correcciones_1311.py
      - name: Validar codigo
        run: python3 scripts/check_release_1311.py
      - name: Reparar formato de iconos Android
        run: |
          javac tools/FixLauncherIcons.java
          java -cp tools FixLauncherIcons

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace
      - name: Compilar APK y AAB Release sin firma (solo verificaciones)
        run: gradle assembleRelease bundleRelease --stacktrace
      - name: Verificar manifiesto y recursos del APK Release compilado
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$AAPT2"
          "$AAPT2" dump badging "$APK" > /tmp/md1311-badging.txt
          grep -q "package: name='cl.mascotadatos.app' versionCode='1311' versionName='1.3.11'" /tmp/md1311-badging.txt
          grep -q "^application: label=" /tmp/md1311-badging.txt
          grep -q "icon=" /tmp/md1311-badging.txt
          "$AAPT2" dump resources "$APK" > /tmp/md1311-resources.txt
          grep -q 'ic_launcher' /tmp/md1311-resources.txt
          echo "PASS: APK con paquete, version e icono oficial presentes"
      - name: Validar rechazo de APK Release sin firma con apksigner
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if "$APKSIGNER" verify --verbose "$APK" > /tmp/md-apksigner.txt 2>&1; then
            echo "ERROR: el APK marcado sin firma fue aceptado como firmado"
            cat /tmp/md-apksigner.txt
            exit 1
          fi
          echo "PASS: el APK sin firma se rechaza; no distribuir este artefacto"
      - name: Guardar APK y AAB Release SIN FIRMAR
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-1.3.11-RELEASE-SIN-FIRMA-NO-INSTALAR
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-1.3.11-APK-DEBUG-NO-ACTUALIZACION
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
