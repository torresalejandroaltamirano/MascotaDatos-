name: MascotaDatos 1.3.11 - APK de validacion
on:
  pull_request:
    branches: [v1.3.11-cierre]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Validar codigo
        run: python3 scripts/check_release_1311.py
      - name: Reparar formato de iconos Android
        run: |
          javac tools/FixLauncherIcons.java
          java -cp tools FixLauncherIcons

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace
      - name: Compilar APK y AAB Release sin firma (solo verificaciones)
        run: gradle assembleRelease bundleRelease --stacktrace
      - name: Guardar APK y AAB Release SIN FIRMAR
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-1.3.11-RELEASE-SIN-FIRMA-NO-INSTALAR
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-1.3.11-APK-DEBUG-NO-ACTUALIZACION
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
