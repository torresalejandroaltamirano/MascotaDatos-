name: MascotaDatos 1.3.11 - puerta de validacion
on:
  workflow_dispatch:
  pull_request:
    branches: [v1.3.11-cierre]
  push:
    branches: [validacion-1.3.11-publicacion]
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcciones finales 1.3.11
        run: python3 scripts/aplicar_correcciones_1311.py
      - name: Comprobar navegacion version e identificadores
        run: python3 scripts/check_release_1311.py
      - name: Comprobar ausencia de secretos versionados
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(.*\.jks|.*\.keystore|.*\.p12|.*\.pfx|CREDENCIALES_GUARDAR\.txt)$'; then
            echo "ERROR: posible archivo de firma o credenciales versionado"
            exit 1
          fi
          echo "No se detectaron los formatos de claves prohibidos."
