name: Validar renovación Compose
on:
  push:
    branches: [feat/mascotadatos-compose-renovacion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preparar interfaz existente
        run: python3 scripts/aplicar_correcciones_1311.py
      - name: Verificar preservación de funciones
        run: python3 scripts/check_release_1311.py
      - name: Probar filtros y navegación de veterinarias
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Preparar iconos Android
        run: |
          javac tools/FixLauncherIcons.java
          java -cp tools FixLauncherIcons
      - name: Compilar Debug y Release
        run: gradle assembleDebug assembleRelease bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-Compose-VALIDACION-no-publicar
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
