name: Validar renovación Compose
on:
  push:
    branches: [feat/mascotadatos-compose-renovacion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preparar interfaz existente
        run: python3 scripts/aplicar_correcciones_1311.py
      - name: Verificar preservación de funciones
        run: python3 scripts/check_release_1311.py
      - name: Probar filtros y navegación de veterinarias
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Preparar iconos Android
        run: |
          javac tools/FixLauncherIcons.java
          java -cp tools FixLauncherIcons
      - name: Compilar Debug y Release
        run: gradle testDebugUnitTest assembleDebug assembleRelease bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-Compose-VALIDACION-no-publicar
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab


      - name: Habilitar aceleración de emulador
        run: sudo chmod 666 /dev/kvm
      - name: Probar pantalla nativa en Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 360
            gradle connectedDebugAndroidTest --stacktrace
            mkdir -p screenshots
            adb pull /sdcard/Android/data/cl.mascotadatos.app/files/screenshots/. screenshots/
      - name: Guardar captura y resultados de Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-1315-pruebas-pantalla
          path: |
            screenshots/
            app/build/reports/androidTests/
            recovery/build/reports/tests/
