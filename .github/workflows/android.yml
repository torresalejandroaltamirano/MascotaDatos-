name: Compilar MascotaDatos Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v35-profesional
      - finalizacion-v35
      - instalable-v35-separada

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Instalar Android API 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validar JavaScript integrado
        run: |
          node -e "const fs=require('fs'),vm=require('vm');const h=fs.readFileSync('app/src/main/assets/index.html','utf8');const r=/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi;let m;while((m=r.exec(h))){if(m[1].trim())new vm.Script(m[1]);}"

      - name: Compilar APK y AAB
        run: gradle assembleDebug bundleRelease --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar AAB sin firma
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-AAB-sin-firma
          path: app/build/outputs/bundle/release/app-release.aab
