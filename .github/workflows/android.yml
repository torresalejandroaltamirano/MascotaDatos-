name: Compilar MascotaDatos Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v35-profesional
      - v1.3.11-cierre
      - test/mascotadatos-1311-navegacion-estable

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Instalar Android API 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verificar recursos de la interfaz
        run: |
          test -s app/src/main/assets/index.html || { echo 'ERROR: index.html ausente o vacio'; exit 1; }
          test -s app/src/main/assets/md-navigation-stable.js || { echo 'ERROR: puente de navegacion ausente'; exit 1; }

      - name: Compilar APK de prueba y AAB de diagnostico
        run: gradle assembleDebug bundleRelease --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar AAB de diagnostico sin firma de publicacion
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-AAB-SIN-FIRMA
          path: app/build/outputs/bundle/release/*.aab
