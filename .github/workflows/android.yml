name: Compilar MascotaDatos Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v35-profesional
      - v1.3.11-cierre
      - test/mascotadatos-1311-navegacion-estable

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Instalar Android API 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verificar recursos de la interfaz
        run: |
          test -s app/src/main/assets/index.html || { echo 'ERROR: index.html ausente o vacio'; exit 1; }
          test -s app/src/main/assets/md-navigation-stable.js || { echo 'ERROR: puente de navegacion ausente'; exit 1; }

      - name: Compilar APK de prueba
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee gradle-apk.log

      - name: Resumir error de compilacion
        if: failure()
        shell: bash
        run: |
          {
            echo "## MascotaDatos 1.3.11 - Diagnostico APK"
            echo "Rama: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo '### Primeras lineas relevantes del error'
            echo '```text'
            if [ -f gradle-apk.log ]; then
              grep -n -m 30 -E '(^FAILURE:|^\* What went wrong:|^\* Exception is:|Execution failed for task|^e: |^error: |error:|A failure occurred|Could not resolve|Caused by:)' gradle-apk.log || true
            else
              echo "No se genero el registro de Gradle."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar registro de diagnostico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-Gradle-Diagnostico
          path: gradle-apk.log
          if-no-files-found: warn

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Compilar AAB de diagnostico
        continue-on-error: true
        run: gradle bundleRelease --stacktrace --console=plain

      - name: Guardar AAB de diagnostico sin firma de publicacion
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-AAB-SIN-FIRMA
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
