name: Compilar MascotaDatos Android

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v1.3.11-cierre
    paths:
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'settings.gradle.kts'
  push:
    branches:
      - main
      - v35-profesional
      - v1.3.11-cierre

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Instalar Android API 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compilar APK y AAB de prueba
        run: gradle assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Guardar artefactos no firmados
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-1.3.11-AdMob-TEST
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
