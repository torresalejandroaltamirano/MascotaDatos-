name: Generar MascotaDatos 1.3.5 Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar firma MascotaDatos
        env:
          MASCOTADATOS_KEYSTORE_BASE64: ${{ secrets.MASCOTADATOS_KEYSTORE_BASE64 }}
        run: |
          test -n "$MASCOTADATOS_KEYSTORE_BASE64"
          echo "$MASCOTADATOS_KEYSTORE_BASE64" | base64 --decode > mascotadatos-release.keystore
          test -s mascotadatos-release.keystore

      - name: Generar APK y AAB Release
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Firmar y verificar APK
        env:
          MASCOTADATOS_KEYSTORE_PASSWORD: ${{ secrets.MASCOTADATOS_KEYSTORE_PASSWORD }}
          MASCOTADATOS_KEY_ALIAS: ${{ secrets.MASCOTADATOS_KEY_ALIAS }}
          MASCOTADATOS_KEY_PASSWORD: ${{ secrets.MASCOTADATOS_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks mascotadatos-release.keystore \
            --ks-pass env:MASCOTADATOS_KEYSTORE_PASSWORD \
            --ks-key-alias "$MASCOTADATOS_KEY_ALIAS" \
            --key-pass env:MASCOTADATOS_KEY_PASSWORD \
            --out app/build/outputs/apk/release/MascotaDatos-1.3.5-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/MascotaDatos-1.3.5-release.apk

      - name: Firmar y verificar AAB
        env:
          MASCOTADATOS_KEYSTORE_PASSWORD: ${{ secrets.MASCOTADATOS_KEYSTORE_PASSWORD }}
          MASCOTADATOS_KEY_ALIAS: ${{ secrets.MASCOTADATOS_KEY_ALIAS }}
          MASCOTADATOS_KEY_PASSWORD: ${{ secrets.MASCOTADATOS_KEY_PASSWORD }}
        run: |
          jarsigner \
            -keystore mascotadatos-release.keystore \
            -storepass "$MASCOTADATOS_KEYSTORE_PASSWORD" \
            -keypass "$MASCOTADATOS_KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab \
            "$MASCOTADATOS_KEY_ALIAS"
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/MascotaDatos-1.3.5-release.aab

      - name: Guardar APK y AAB
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-1.3.5-RELEASE
          path: |
            app/build/outputs/apk/release/MascotaDatos-1.3.5-release.apk
            app/build/outputs/bundle/release/MascotaDatos-1.3.5-release.aab
          if-no-files-found: error
