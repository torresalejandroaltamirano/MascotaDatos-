name: Generar REDYA Release AAB

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar firma
        env:
          REDYA_KEYSTORE_BASE64: ${{ secrets.REDYA_KEYSTORE_BASE64 }}
          REDYA_KEYSTORE_PASSWORD: ${{ secrets.REDYA_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$REDYA_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > redya-release.keystore
          test -s redya-release.keystore
          keytool -list -keystore redya-release.keystore -storepass "$REDYA_KEYSTORE_PASSWORD" >/dev/null

      - name: Generar AAB Release
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Firmar AAB
        env:
          REDYA_KEYSTORE_PASSWORD: ${{ secrets.REDYA_KEYSTORE_PASSWORD }}
          REDYA_KEY_ALIAS: ${{ secrets.REDYA_KEY_ALIAS }}
          REDYA_KEY_PASSWORD: ${{ secrets.REDYA_KEY_PASSWORD }}
        run: |
          jarsigner \
            -keystore redya-release.keystore \
            -storepass "$REDYA_KEYSTORE_PASSWORD" \
            -keypass "$REDYA_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            app/build/outputs/bundle/release/app-release.aab \
            "$REDYA_KEY_ALIAS"
          jarsigner -verify -verbose app/build/outputs/bundle/release/app-release.aab

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: REDYA-AAB-RELEASE
          path: app/build/outputs/bundle/release/app-release.aab
