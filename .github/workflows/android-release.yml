name: Generar MascotaDatos 1.3.5 Release Firma

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mascotadatos-1.3.5-release
    paths:
      - '.github/workflows/android-release.yml'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configurar Android SDK API 36
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Preparar firma MascotaDatos
        env:
          MASCOTADATOS_KEYSTORE_BASE64: ${{ secrets.MASCOTADATOS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$MASCOTADATOS_KEYSTORE_BASE64"
          printf '%s' "$MASCOTADATOS_KEYSTORE_BASE64" | base64 --decode > mascotadatos-release.keystore
          test -s mascotadatos-release.keystore
          chmod 600 mascotadatos-release.keystore
          keytool -list -keystore mascotadatos-release.keystore -storepass "$MASCOTADATOS_KEYSTORE_PASSWORD" -alias "$MASCOTADATOS_KEY_ALIAS" >/dev/null
        env:
          MASCOTADATOS_KEYSTORE_BASE64: ${{ secrets.MASCOTADATOS_KEYSTORE_BASE64 }}
          MASCOTADATOS_KEYSTORE_PASSWORD: ${{ secrets.MASCOTADATOS_KEYSTORE_PASSWORD }}
          MASCOTADATOS_KEY_ALIAS: ${{ secrets.MASCOTADATOS_KEY_ALIAS }}

      - name: Compilar APK y AAB Release
        env:
          MASCOTADATOS_KEYSTORE_PATH: mascotadatos-release.keystore
          MASCOTADATOS_KEYSTORE_PASSWORD: ${{ secrets.MASCOTADATOS_KEYSTORE_PASSWORD }}
          MASCOTADATOS_KEY_ALIAS: ${{ secrets.MASCOTADATOS_KEY_ALIAS }}
          MASCOTADATOS_KEY_PASSWORD: ${{ secrets.MASCOTADATOS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Verificar APK firmado v1 v2 v3
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" app/build/outputs/apk/release/MascotaDatos-1.3.5-FIRMADO.apk
          sha256sum app/build/outputs/apk/release/MascotaDatos-1.3.5-FIRMADO.apk

      - name: Verificar AAB firmado
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs "$AAB"
          cp "$AAB" app/build/outputs/bundle/release/MascotaDatos-1.3.5-FIRMADO.aab
          sha256sum app/build/outputs/bundle/release/MascotaDatos-1.3.5-FIRMADO.aab

      - name: Guardar APK y AAB firmados
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-1.3.5-FIRMADO
          path: |
            app/build/outputs/apk/release/MascotaDatos-1.3.5-FIRMADO.apk
            app/build/outputs/bundle/release/MascotaDatos-1.3.5-FIRMADO.aab
          if-no-files-found: error
