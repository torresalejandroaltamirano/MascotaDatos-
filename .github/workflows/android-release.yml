name: Generar MascotaDatos 1.3.11 firmado

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Instalar Android API 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar firma MascotaDatos
        env:
          MASCOTADATOS_KEYSTORE_BASE64: ${{ secrets.MASCOTADATOS_KEYSTORE_BASE64 }}
          MASCOTADATOS_KEYSTORE_PASSWORD: ${{ secrets.MASCOTADATOS_KEYSTORE_PASSWORD }}
        run: |
          test -n "$MASCOTADATOS_KEYSTORE_BASE64"
          test -n "$MASCOTADATOS_KEYSTORE_PASSWORD"
          printf '%s' "$MASCOTADATOS_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > mascotadatos-release.jks
          test -s mascotadatos-release.jks
          keytool -list -keystore mascotadatos-release.jks -storepass "$MASCOTADATOS_KEYSTORE_PASSWORD" >/dev/null

      - name: Comprobar certificado de actualización original
        env:
          MASCOTADATOS_KEYSTORE_PASSWORD: ${{ secrets.MASCOTADATOS_KEYSTORE_PASSWORD }}
          MASCOTADATOS_KEY_ALIAS: ${{ secrets.MASCOTADATOS_KEY_ALIAS }}
        run: |
          test -n "$MASCOTADATOS_KEY_ALIAS"
          EXPECTED="CADAF8B58B5055A83312D9C4531AE574B9EE68FBDE615AB1BA1401D4225F9FCC"
          KEYINFO="$(keytool -list -v -keystore mascotadatos-release.jks -alias "$MASCOTADATOS_KEY_ALIAS" -storepass "$MASCOTADATOS_KEYSTORE_PASSWORD")"
          if ! printf '%s\n' "$KEYINFO" | grep -q 'PrivateKeyEntry'; then
            echo "::error::El alias indicado no contiene una clave privada; no se puede firmar una actualización."
            exit 1
          fi
          ACTUAL="$(printf '%s\n' "$KEYINFO" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::El certificado de firma no coincide con la APK aprobada; se detiene la compilación."
            exit 1
          fi

      - name: Compilar APK y AAB Release
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Firmar APK
        env:
          MASCOTADATOS_KEYSTORE_PASSWORD: ${{ secrets.MASCOTADATOS_KEYSTORE_PASSWORD }}
          MASCOTADATOS_KEY_ALIAS: ${{ secrets.MASCOTADATOS_KEY_ALIAS }}
          MASCOTADATOS_KEY_PASSWORD: ${{ secrets.MASCOTADATOS_KEY_PASSWORD }}
        run: |
          test -n "$MASCOTADATOS_KEY_ALIAS"
          test -n "$MASCOTADATOS_KEY_PASSWORD"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/MascotaDatos-1.3.11-signed.apk"
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
            --ks mascotadatos-release.jks \
            --ks-key-alias "$MASCOTADATOS_KEY_ALIAS" \
            --ks-pass env:MASCOTADATOS_KEYSTORE_PASSWORD \
            --key-pass env:MASCOTADATOS_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$SIGNED_APK"

      - name: Validar APK firmada para actualizar 1.3.10
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/MascotaDatos-1.3.11-signed.apk"
          EXPECTED="CADAF8B58B5055A83312D9C4531AE574B9EE68FBDE615AB1BA1401D4225F9FCC"
          INFO="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")"
          ACTUAL="$(printf '%s\\n' "$INFO" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::La APK final tiene un certificado diferente."; exit 1; }
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\\n' "$BADGING" | grep -q "package: name='cl.mascotadatos.app' versionCode='1311' versionName='1.3.11'"

      - name: Firmar AAB
        env:
          MASCOTADATOS_KEYSTORE_PASSWORD: ${{ secrets.MASCOTADATOS_KEYSTORE_PASSWORD }}
          MASCOTADATOS_KEY_ALIAS: ${{ secrets.MASCOTADATOS_KEY_ALIAS }}
          MASCOTADATOS_KEY_PASSWORD: ${{ secrets.MASCOTADATOS_KEY_PASSWORD }}
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          jarsigner \
            -keystore mascotadatos-release.jks \
            -storepass "$MASCOTADATOS_KEYSTORE_PASSWORD" \
            -keypass "$MASCOTADATOS_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" \
            "$MASCOTADATOS_KEY_ALIAS"
          jarsigner -verify -strict "$AAB"
          EXPECTED="CADAF8B58B5055A83312D9C4531AE574B9EE68FBDE615AB1BA1401D4225F9FCC"
          CERT_SHA="$(keytool -printcert -jarfile "$AAB" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$CERT_SHA" != "$EXPECTED" ]; then
            echo "::error::El certificado del AAB no coincide con la firma de MascotaDatos."
            exit 1
          fi

      - name: Eliminar archivo temporal de firma
        if: always()
        run: |
          rm -f mascotadatos-release.jks

      - name: Generar hashes SHA-256
        run: |
          sha256sum app/build/outputs/apk/release/MascotaDatos-1.3.11-signed.apk > MascotaDatos-1.3.11-SHA256.txt
          sha256sum app/build/outputs/bundle/release/app-release.aab >> MascotaDatos-1.3.11-SHA256.txt
          cat MascotaDatos-1.3.11-SHA256.txt

      - name: Guardar APK, AAB y hashes
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-1.3.11-RELEASE
          path: |
            app/build/outputs/apk/release/MascotaDatos-1.3.11-signed.apk
            app/build/outputs/bundle/release/app-release.aab
            MascotaDatos-1.3.11-SHA256.txt
