name: Generar MascotaDatos 1.3.11 firmado

on:
  workflow_dispatch:
  push:
    branches: [validacion-1.3.11-publicacion]
    paths:
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Instalar Android API 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Aplicar correcciones finales antes de firmar
        run: python3 scripts/aplicar_correcciones_1311.py

      - name: Validar fuente antes de Release
        run: python3 scripts/check_release_1311.py

      - name: Preparar firma MascotaDatos
        env:
          MASCOTADATOS_KEYSTORE_BASE64: ${{ secrets.MASCOTADATOS_KEYSTORE_BASE64 }}
          MASCOTADATOS_KEYSTORE_PASSWORD: ${{ secrets.MASCOTADATOS_KEYSTORE_PASSWORD }}
        run: |
          test -n "$MASCOTADATOS_KEYSTORE_BASE64"
          test -n "$MASCOTADATOS_KEYSTORE_PASSWORD"
          printf '%s' "$MASCOTADATOS_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > mascotadatos-release.jks
          test -s mascotadatos-release.jks
          keytool -list -keystore mascotadatos-release.jks -storepass "$MASCOTADATOS_KEYSTORE_PASSWORD" >/dev/null

      - name: Verificar certificado esperado antes de firmar
        env:
          MASCOTADATOS_KEYSTORE_PASSWORD: ${{ secrets.MASCOTADATOS_KEYSTORE_PASSWORD }}
          MASCOTADATOS_KEY_ALIAS: ${{ secrets.MASCOTADATOS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$MASCOTADATOS_KEY_ALIAS"
          EXPECTED="CADAF8B58B5055A83312D9C4531AE574B9EE68FBDE615AB1BA1401D4225F9FCC"
          ACTUAL="$(keytool -exportcert -keystore mascotadatos-release.jks -alias "$MASCOTADATOS_KEY_ALIAS" -storepass "$MASCOTADATOS_KEYSTORE_PASSWORD" | sha256sum | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Certificado release diferente al respaldo esperado. Compilacion bloqueada."
            exit 1
          fi
          echo "Huella del certificado de firma release coincide con el respaldo verificado."

      - name: Reparar formato de iconos Android
        run: |
          javac tools/FixLauncherIcons.java
          java -cp tools FixLauncherIcons

      - name: Compilar APK y AAB Release
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Firmar APK
        env:
          MASCOTADATOS_KEYSTORE_PASSWORD: ${{ secrets.MASCOTADATOS_KEYSTORE_PASSWORD }}
          MASCOTADATOS_KEY_ALIAS: ${{ secrets.MASCOTADATOS_KEY_ALIAS }}
          MASCOTADATOS_KEY_PASSWORD: ${{ secrets.MASCOTADATOS_KEY_PASSWORD }}
        run: |
          test -n "$MASCOTADATOS_KEY_ALIAS"
          test -n "$MASCOTADATOS_KEY_PASSWORD"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/MascotaDatos-1.3.11-signed.apk"
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
            --ks mascotadatos-release.jks \
            --ks-key-alias "$MASCOTADATOS_KEY_ALIAS" \
            --ks-pass env:MASCOTADATOS_KEYSTORE_PASSWORD \
            --key-pass env:MASCOTADATOS_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$SIGNED_APK"

      - name: Firmar AAB
        env:
          MASCOTADATOS_KEYSTORE_PASSWORD: ${{ secrets.MASCOTADATOS_KEYSTORE_PASSWORD }}
          MASCOTADATOS_KEY_ALIAS: ${{ secrets.MASCOTADATOS_KEY_ALIAS }}
          MASCOTADATOS_KEY_PASSWORD: ${{ secrets.MASCOTADATOS_KEY_PASSWORD }}
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          jarsigner \
            -keystore mascotadatos-release.jks \
            -storepass "$MASCOTADATOS_KEYSTORE_PASSWORD" \
            -keypass "$MASCOTADATOS_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" \
            "$MASCOTADATOS_KEY_ALIAS"
          jarsigner -verify -verbose "$AAB"
          # La firma del bundle debe provenir de la misma clave de actualización.
          EXPECTED="CADAF8B58B5055A83312D9C4531AE574B9EE68FBDE615AB1BA1401D4225F9FCC"
          AAB_FINGERPRINT="$(keytool -printcert -jarfile "$AAB" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$AAB_FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::AAB firmado con otro certificado. Bloqueado."
            exit 1
          fi

      - name: Generar hashes SHA-256
        run: |
          sha256sum app/build/outputs/apk/release/MascotaDatos-1.3.11-signed.apk > MascotaDatos-1.3.11-SHA256.txt
          sha256sum app/build/outputs/bundle/release/app-release.aab >> MascotaDatos-1.3.11-SHA256.txt
          cat MascotaDatos-1.3.11-SHA256.txt

      - name: Comprobar AAB firmado y APK publicada
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/MascotaDatos-1.3.11-signed.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/MascotaDatos-1.3.11-signed.apk
          EXPECTED="CADAF8B58B5055A83312D9C4531AE574B9EE68FBDE615AB1BA1401D4225F9FCC"
          ACTUAL="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/MascotaDatos-1.3.11-signed.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK final incompatible con certificado de version 1.3.10."
            exit 1
          fi

      - name: Eliminar firma privada del entorno
        if: always()
        run: rm -f mascotadatos-release.jks

      - name: Guardar APK, AAB y hashes
        uses: actions/upload-artifact@v4
        with:
          name: MascotaDatos-1.3.11-RELEASE
          path: |
            app/build/outputs/apk/release/MascotaDatos-1.3.11-signed.apk
            app/build/outputs/bundle/release/app-release.aab
            MascotaDatos-1.3.11-SHA256.txt
